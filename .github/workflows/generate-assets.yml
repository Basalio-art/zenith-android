name: Generate Capacitor Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**'

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Capacitor Assets 
        run: npx -y @capacitor/assets generate --android --iconBackgroundColor "#00050e" --iconBackgroundColorDark "#00050e"

      - name: Commit generated Android assets back to Git
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate android assets [skip ci]"
          file_pattern: "android/app/src/main/res/**"
