name: Generate Capacitor Assets

on:
  # Allows you to trigger this manually from the GitHub Actions tab
  workflow_dispatch:
  # Optional: Also run automatically when assets source files change
  push:
    paths:
      - 'assets/**'

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push generated files back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Capacitor Assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000'

      - name: Commit generated Android assets back to Git
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate android assets [skip ci]"
          file_pattern: "android/app/src/main/res/*"
