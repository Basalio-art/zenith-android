name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Vite Web App
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Sync Code to Capacitor Android
        run: npx cap sync android

      - name: Verify Release Keystore
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/zenith-release.jks \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS"

      - name: Restore Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/zenith-release.jks

      - name: Build Release APKs
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/android/zenith-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Collect Release APKs
        run: |
          mkdir -p release-apks

          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -exec cp {} release-apks/ \;

          echo "================================"
          echo "Generated APKs:"
          echo "================================"

          ls -lh release-apks

      - name: Remove Temporary Keystore
        if: always()
        run: |
          rm -f android/zenith-release.jks

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: zenith-release-apks
          path: release-apks/
          if-no-files-found: error
